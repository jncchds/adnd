# Production docker-compose — RabbitMQ management port exposed, AMQP port internal only
version: '3.8'
services:
  app:
    environment:
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Port=5672
      - RabbitMq__Username=${RABBITMQ_USER:-adnd}
      - RabbitMq__Password=${RABBITMQ_PASS:-adnd}
      - RabbitMq__VirtualHost=adnd

  rabbitmq:
    image: rabbitmq:3-management
    container_name: adnd-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-adnd}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-adnd}
      RABBITMQ_DEFAULT_VHOST: /adnd
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  rabbitmq_data:
