services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: adnd
      POSTGRES_USER: adnd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "adnd"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - adnd-data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: src/Adnd.Server/Dockerfile
    ports:
      - "${APP_PORT:-5010}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    environment:
      # No "Include Error Detail" here: it makes Npgsql embed parameter values and row
      # data in exception messages, which then reach logs and error responses.
      ConnectionStrings__Default: "Host=postgres;Database=adnd;Username=adnd;Password=${POSTGRES_PASSWORD}"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      JwtSettings__Issuer: ${JWT_ISSUER:-adnd-server}
      JwtSettings__Audience: ${JWT_AUDIENCE:-adnd-client}
      Encryption__MasterKey: ${ENCRYPTION_MASTER_KEY}
      Resilience__RetryDelayMs: 500
      Resilience__MaxRetries: 3
      Resilience__FailureThreshold: 5
      Resilience__HalfOpenDurationSeconds: 30
      RateLimiting__GlobalPermitLimit: 100
      RateLimiting__AuthPermitLimit: 10
      RateLimiting__LLMPresetPermitLimit: 30
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
      ASPNETCORE_ENVIRONMENT: Production

  # SDK service for running EF migrations and other dev tooling.
  # Usage: docker compose run --rm sdk dotnet ef migrations add <Name> --project src/Adnd.Server
  sdk:
    build:
      context: .
      dockerfile: src/Adnd.Server/Dockerfile
      target: sdk-tools
    volumes:
      - .:/repo
    working_dir: /repo
    environment:
      # Detailed Npgsql errors are useful here — this profile is developer tooling only.
      ConnectionStrings__Default: "Host=postgres;Database=adnd;Username=adnd;Password=${POSTGRES_PASSWORD};Include Error Detail=true"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["sdk"]
    entrypoint: [""]
    command: ["bash"]

volumes:
  adnd-data:
